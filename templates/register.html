{% extends "base.html" %}
{% block title %}Bolão - Criar Conta{% endblock %}

{% block content %}
<div class="card mt-3" style="max-width:400px;margin-left:auto;margin-right:auto">
    <h2 class="text-center mb-2">Criar Conta</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus minlength="3" maxlength="20">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="4">
        </div>
        <div class="form-group">
            <label for="password2">Confirmar Senha</label>
            <input type="password" id="password2" name="password2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar Conta</button>
    </form>
    <p class="text-center text-muted text-sm mt-2">
        Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
    </p>
</div>
{% endblock %}
