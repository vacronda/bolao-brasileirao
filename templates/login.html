{% extends "base.html" %}
{% block title %}Bolão - Entrar{% endblock %}

{% block content %}
<div class="card mt-3" style="max-width:400px;margin-left:auto;margin-right:auto">
    <h2 class="text-center mb-2">Entrar</h2>
    <form method="POST" action="{{ url_for('login') }}">
        {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="text-center text-muted text-sm mt-2">
        Não tem conta? <a href="{{ url_for('register') }}">Criar conta</a>
    </p>
</div>
{% endblock %}
